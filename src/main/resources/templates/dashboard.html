<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
    <head>
        <meta charset="UTF-8">
        <title>Dashboard</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
        <link rel="stylesheet" th:href="@{/css/style.css}">
    </head>

    <body>
        <aside>
            <div th:replace="~{fragments/sidebar :: sidebar}"></div>
        </aside>

        <div class="toggle-btn btn btn-dark d-md-none">
            <span>&#9776;</span>
        </div>

        <div class="container mt-4">
            <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mt-4">
                <div>
                    <h1>Dashboard</h1>
                    <p class="text-muted mb-0"
                       th:text="'Chamados criados de ' + ${#temporals.format(dashboard.inicio(), 'dd/MM/yyyy')} + ' a ' + ${#temporals.format(dashboard.fim(), 'dd/MM/yyyy')}"></p>
                </div>
                <div class="btn-group" role="group" aria-label="Período">
                    <a th:each="p : ${periodos}"
                       th:href="@{/(dias=${p.dias})}"
                       th:classappend="${dashboard.periodo() == p} ? 'btn-primary' : 'btn-outline-primary'"
                       class="btn btn-sm"
                       th:text="${p.dias} + ' dias'"></a>
                </div>
            </div>

            <div th:if="${erro}" class="alert alert-danger mt-3" th:text="${erro}"></div>

            <div class="row g-3 mt-2">
                <div class="col-md-4" th:each="c : ${dashboard.cartoes()}">
                    <div class="card text-center h-100">
                        <div class="card-body">
                            <h6 class="text-muted" th:text="${c.rotulo()}"></h6>
                            <h2 class="mb-0" th:text="${c.valor()}"></h2>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card mt-4 mb-4">
                <div class="card-body">
                    <h5 class="card-title">Evolução por status</h5>
                    <div style="position: relative; height: 420px;">
                        <canvas id="graficoStatus"></canvas>
                    </div>
                </div>
            </div>
        </div>

        <script th:inline="javascript">
            window.serieDashboard = /*[[${serie}]]*/ null;
        </script>
        <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
        <script th:src="@{/js/script.js}"></script>
        <script th:src="@{/js/dashboard.js}"></script>
    </body>
</html>
