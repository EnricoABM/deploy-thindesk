<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <title>Clientes</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
        <link rel="stylesheet" th:href="@{/css/style.css}">
    </head>

    <body>
        <!-- Sidebar incluído como fragmento -->
        <aside>
            <div th:replace="~{fragments/sidebar :: sidebar}"></div>
        </aside>

        <!-- Botão para abrir/fechar a sidebar em telas pequenas -->
        <div class="toggle-btn btn btn-dark d-md-none">
            <span>&#9776;</span>
        </div>

        <div class="container mt-4">
            <div class="d-flex justify-content-between align-items-center mt-4">
                <h1>Clientes</h1>
                <a th:href="@{/clientes/novo}" class="btn btn-primary">Novo cliente</a>
            </div>

            <div th:if="${sucesso}" class="alert alert-success mt-3" th:text="${sucesso}"></div>
            <div th:if="${erro}" class="alert alert-danger mt-3" th:text="${erro}"></div>

            <form th:action="@{/clientes}" method="get" class="row g-2 mt-2 mb-3">
                <div class="col-md-5">
                    <label for="nome" class="form-label">Buscar por nome</label>
                    <input type="text" id="nome" name="nome" class="form-control" th:value="${nome}">
                </div>
                <div class="col-md-3">
                    <label for="setor" class="form-label">Setor</label>
                    <select id="setor" name="setor" class="form-select">
                        <option value="" th:selected="${setorFiltro == ''}">Todos</option>
                        <option th:each="s : ${setores}" th:value="${s}" th:text="${s}"
                                th:selected="${s == setorFiltro}"></option>
                    </select>
                </div>
                <div class="col-md-2 d-flex align-items-end">
                    <button type="submit" class="btn btn-secondary w-100">Filtrar</button>
                </div>
                <div class="col-md-2 d-flex align-items-end">
                    <a th:href="@{/clientes}" class="btn btn-outline-secondary w-100">Limpar</a>
                </div>
            </form>

            <table class="table table-bordered table-striped">
                <thead>
                    <tr>
                        <th>Nome</th>
                        <th>Telefone</th>
                        <th>Setor</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${#lists.isEmpty(clientes)}">
                        <td colspan="4" class="text-center text-muted">Nenhum cliente encontrado.</td>
                    </tr>
                    <tr th:each="cliente : ${clientes}">
                        <td th:text="${cliente.nome}"></td>
                        <td th:text="${cliente.telefone}"></td>
                        <td th:text="${cliente.setor}"></td>
                        <td>
                            <a th:href="@{'/clientes/' + ${cliente.id} + '/editar'}" class="btn btn-warning btn-sm">Editar</a>
                            <form th:action="@{'/clientes/' + ${cliente.id} + '/excluir'}" method="post" class="d-inline"
                                  data-confirmar="Remover este cliente?">
                                <button type="submit" class="btn btn-danger btn-sm">Excluir</button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div th:replace="~{fragments/confirmacao :: modal}"></div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
        <script th:src="@{/js/script.js}"></script>
    </body>
</html>
