<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <title th:text="${modoEdicao} ? 'Editar usuário' : 'Novo usuário'">Usuário</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
        <link rel="stylesheet" th:href="@{/css/style.css}">
    </head>

    <body>
        <!-- Sidebar incluído como fragmento -->
        <aside>
            <div th:replace="~{fragments/sidebar :: sidebar}"></div>
        </aside>

        <!-- Botão para abrir/fechar a sidebar em telas pequenas -->
        <div class="toggle-btn btn btn-dark d-md-none">
            <span>&#9776;</span>
        </div>

        <div class="container mt-4">
            <h1 class="mt-4" th:text="${modoEdicao} ? 'Editar usuário' : 'Novo usuário'">Novo usuário</h1>

            <div th:if="${erro}" class="alert alert-danger mt-3" th:text="${erro}"></div>

            <form th:action="@{${acao}}" th:object="${form}" method="post" class="mt-3" style="max-width: 560px;">
                <div class="mb-3">
                    <label for="nome" class="form-label">Nome</label>
                    <input type="text" id="nome" name="nome" class="form-control" required th:value="*{nome}">
                </div>
                <div class="mb-3">
                    <label for="username" class="form-label">Email (login)</label>
                    <input type="email" id="username" name="username" class="form-control" required maxlength="254" th:value="*{username}">
                    <div class="form-text">O email é o login do usuário. Ex.: nome@dominio.com.</div>
                </div>
                <div class="mb-3">
                    <label for="perfil" class="form-label">Perfil</label>
                    <select id="perfil" name="perfil" class="form-select" required>
                        <option th:each="p : ${perfis}" th:value="${p.name()}"
                                th:text="${p.name() == 'TECNICO' ? 'Técnico' : 'Atendente'}"
                                th:selected="${p == form.perfil}"></option>
                    </select>
                </div>
                <div class="mb-3" th:if="${modoEdicao}">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="ativo" name="ativo" value="true"
                               th:checked="*{estaAtivo()}">
                        <label class="form-check-label" for="ativo">Ativo (pode entrar no sistema)</label>
                    </div>
                </div>
                <div class="mb-4">
                    <label for="senha" class="form-label" th:text="${modoEdicao} ? 'Nova senha' : 'Senha inicial'">Senha</label>
                    <input type="password" id="senha" name="senha" class="form-control" minlength="8"
                           th:required="${!modoEdicao}">
                    <div class="form-text" th:if="${modoEdicao}">Deixe em branco para manter a senha atual. Mínimo de 8 caracteres.</div>
                    <div class="form-text" th:unless="${modoEdicao}">Mínimo de 8 caracteres.</div>
                </div>
                <button type="submit" class="btn btn-primary" th:text="${modoEdicao} ? 'Salvar alterações' : 'Cadastrar'">Salvar</button>
                <a th:href="@{/usuarios}" class="btn btn-outline-secondary">Cancelar</a>
            </form>
        </div>
        <script th:src="@{/js/script.js}"></script>
    </body>
</html>
