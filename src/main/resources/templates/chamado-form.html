<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <title th:text="${modoEdicao} ? 'Editar chamado' : 'Novo chamado'">Novo chamado</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
        <link rel="stylesheet" th:href="@{/css/style.css}">
    </head>

    <body>
        <aside>
            <div th:replace="~{fragments/sidebar :: sidebar}"></div>
        </aside>

        <div class="toggle-btn btn btn-dark d-md-none">
            <span>&#9776;</span>
        </div>

        <div class="container mt-4">
            <h1 class="mt-4" th:text="${modoEdicao} ? 'Editar chamado' : 'Novo chamado'">Novo chamado</h1>

            <div th:if="${erro}" class="alert alert-danger mt-3" th:text="${erro}"></div>

            <form th:action="@{${acao}}" th:object="${form}" method="post" class="mt-3" style="max-width: 640px;">
                <div class="mb-3" th:unless="${modoEdicao}">
                    <label for="clienteId" class="form-label">Cliente</label>
                    <select id="clienteId" name="clienteId" class="form-select" required>
                        <option value="">Selecione um cliente</option>
                        <option th:each="c : ${clientes}" th:value="${c.id}" th:text="${c.nome}"
                                th:selected="${form.clienteId == c.id}"></option>
                    </select>
                </div>
                <div class="mb-3">
                    <label for="titulo" class="form-label">Título</label>
                    <input type="text" id="titulo" name="titulo" class="form-control" required minlength="3" maxlength="100" th:value="*{titulo}">
                </div>
                <div class="mb-3">
                    <label for="tipo" class="form-label">Tipo</label>
                    <input type="text" id="tipo" name="tipo" class="form-control" required minlength="2" maxlength="60" th:value="*{tipo}">
                </div>
                <div class="mb-3">
                    <label for="prioridade" class="form-label">Prioridade</label>
                    <select id="prioridade" name="prioridade" class="form-select">
                        <option th:each="p : ${prioridades}" th:value="${p.name()}" th:text="${p.rotulo}"
                                th:selected="${form.prioridade == p}"></option>
                    </select>
                </div>
                <div class="mb-4">
                    <label for="descricao" class="form-label">Descrição</label>
                    <textarea id="descricao" name="descricao" class="form-control" rows="4" required minlength="5" maxlength="1000" th:text="*{descricao}"></textarea>
                </div>
                <button type="submit" class="btn btn-primary" th:text="${modoEdicao} ? 'Salvar alterações' : 'Abrir chamado'">Abrir chamado</button>
                <a th:href="@{${voltar}}" class="btn btn-outline-secondary">Cancelar</a>
            </form>
        </div>
        <script th:src="@{/js/script.js}"></script>
    </body>
</html>
