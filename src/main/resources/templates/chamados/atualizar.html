<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Editar Chamado</title>
</head>
<body>
    <h1>Editar Chamado</h1>
    <form th:action="@{/chamados/atualizar/{id}(id=${chamado.id})}" th:object="${chamado}" method="post">
        <label for="descricao">Descrição:</label>
        <input type="text" id="descricao" name="descricao" th:value="*{descricao}" />

        <label for="status">Status:</label>
        <select id="status" name="status" th:value="*{status}">
            <option value="ABERTO">Aberto</option>
            <option value="EM_ATENDIMENTO">Em atendimento</option>
            <option value="AGUARDANDO_CLIENTE">Aguardando cliente</option>
            <option value="RESOLVIDO">Resolvido</option>
            <option value="FECHADO">Fechado</option>
        </select>

        <label for="tipo">Tipo:</label>
        <input type="text" id="tipo" name="tipo" th:value="*{tipo}" />

        <label for="tecnicoId">Técnico (id):</label>
        <input type="text" id="tecnicoId" name="tecnicoId" th:value="*{tecnicoId}" />

        <button type="submit">Salvar</button>
    </form>
</body>
</html>
