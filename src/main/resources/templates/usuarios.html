<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <title>Usuários</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
        <link rel="stylesheet" th:href="@{/css/style.css}">
    </head>

    <body>
        <!-- Sidebar incluído como fragmento -->
        <aside>
            <div th:replace="~{fragments/sidebar :: sidebar}"></div>
        </aside>

        <!-- Botão para abrir/fechar a sidebar em telas pequenas -->
        <div class="toggle-btn btn btn-dark d-md-none">
            <span>&#9776;</span>
        </div>

        <div class="container mt-4">
            <div class="d-flex justify-content-between align-items-center mt-4">
                <h1>Usuários</h1>
                <a th:href="@{/usuarios/novo}" class="btn btn-primary">Novo usuário</a>
            </div>

            <div th:if="${sucesso}" class="alert alert-success mt-3" th:text="${sucesso}"></div>
            <div th:if="${erro}" class="alert alert-danger mt-3" th:text="${erro}"></div>

            <form th:action="@{/usuarios}" method="get" class="row g-2 mt-2 mb-3">
                <div class="col-md-5">
                    <label for="q" class="form-label">Buscar por nome ou email</label>
                    <input type="text" id="q" name="q" class="form-control" th:value="${q}">
                </div>
                <div class="col-md-3">
                    <label for="perfil" class="form-label">Perfil</label>
                    <select id="perfil" name="perfil" class="form-select">
                        <option value="" th:selected="${perfilFiltro == ''}">Todos</option>
                        <option th:each="p : ${perfisFiltro}" th:value="${p}"
                                th:text="${p.name() == 'ADMINISTRADOR' ? 'Administrador' : (p.name() == 'TECNICO' ? 'Técnico' : 'Atendente')}"
                                th:selected="${p.name() == perfilFiltro}"></option>
                    </select>
                </div>
                <div class="col-md-2 d-flex align-items-end">
                    <button type="submit" class="btn btn-secondary w-100">Filtrar</button>
                </div>
                <div class="col-md-2 d-flex align-items-end">
                    <a th:href="@{/usuarios}" class="btn btn-outline-secondary w-100">Limpar</a>
                </div>
            </form>

            <table class="table table-bordered table-striped">
                <thead>
                    <tr>
                        <th>Nome</th>
                        <th>Email</th>
                        <th>Perfil</th>
                        <th>Situação</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${#lists.isEmpty(usuarios)}">
                        <td colspan="5" class="text-center text-muted">Nenhum usuário encontrado.</td>
                    </tr>
                    <tr th:each="u : ${usuarios}">
                        <td th:text="${u.nome}"></td>
                        <td th:text="${u.username}"></td>
                        <td th:text="${u.perfil.name() == 'ADMINISTRADOR' ? 'Administrador' : (u.perfil.name() == 'TECNICO' ? 'Técnico' : 'Atendente')}"></td>
                        <td th:text="${u.ativo} ? 'Ativo' : 'Inativo'"></td>
                        <td>
                            <a th:if="${u.editavel}"
                               th:href="@{'/usuarios/' + ${u.id} + '/editar'}"
                               class="btn btn-warning btn-sm">Editar</a>
                            <form th:if="${u.id != usuarioLogadoId}" th:action="@{'/usuarios/' + ${u.id} + '/excluir'}"
                                  method="post" class="d-inline"
                                  data-confirmar="Remover este usuário?">
                                <button type="submit" class="btn btn-danger btn-sm">Excluir</button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div th:replace="~{fragments/confirmacao :: modal}"></div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
        <script th:src="@{/js/script.js}"></script>
    </body>
</html>
