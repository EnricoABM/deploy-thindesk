<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
    <head>
        <meta charset="UTF-8">
        <title>Chamados</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
        <link rel="stylesheet" th:href="@{/css/style.css}">
    </head>

    <body>
        <aside>
            <div th:replace="~{fragments/sidebar :: sidebar}"></div>
        </aside>

        <div class="toggle-btn btn btn-dark d-md-none">
            <span>&#9776;</span>
        </div>

        <div class="container mt-4">
            <div class="d-flex justify-content-between align-items-center mt-4">
                <h1>Chamados</h1>
                <a sec:authorize="hasAnyRole('ATENDENTE','ADMINISTRADOR')" th:href="@{/chamados/novo}" class="btn btn-primary">Novo chamado</a>
            </div>

            <div th:if="${sucesso}" class="alert alert-success mt-3" th:text="${sucesso}"></div>
            <div th:if="${erro}" class="alert alert-danger mt-3" th:text="${erro}"></div>

            <form th:action="@{/chamados}" method="get" class="row g-2 mt-2 mb-3">
                <div class="col-md-5">
                    <label for="titulo" class="form-label">Buscar por título</label>
                    <input type="text" id="titulo" name="titulo" class="form-control" th:value="${titulo}">
                </div>
                <div class="col-md-3">
                    <label for="status" class="form-label">Status</label>
                    <select id="status" name="status" class="form-select">
                        <option value="" th:selected="${statusFiltro == null}">Todos</option>
                        <option th:each="s : ${statusOpcoes}" th:value="${s.name()}" th:text="${s.rotulo}"
                                th:selected="${s == statusFiltro}"></option>
                    </select>
                </div>
                <div class="col-md-2 d-flex align-items-end">
                    <button type="submit" class="btn btn-secondary w-100">Filtrar</button>
                </div>
                <div class="col-md-2 d-flex align-items-end">
                    <a th:href="@{/chamados}" class="btn btn-outline-secondary w-100">Limpar</a>
                </div>
            </form>

            <table class="table table-bordered table-striped">
                <thead>
                    <tr>
                        <th>Título</th>
                        <th>Cliente</th>
                        <th>Status</th>
                        <th>Prioridade</th>
                        <th>Técnico</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${#lists.isEmpty(chamados)}">
                        <td colspan="6" class="text-center text-muted">Nenhum chamado encontrado.</td>
                    </tr>
                    <tr th:each="c : ${chamados}">
                        <td th:text="${c.titulo}"></td>
                        <td th:text="${c.clienteId != null ? nomes.get(c.clienteId) : ''}"></td>
                        <td th:text="${c.status.rotulo}"></td>
                        <td th:text="${c.prioridade.rotulo}"></td>
                        <td th:text="${c.tecnicoId != null ? nomes.get(c.tecnicoId) : 'Sem técnico'}"></td>
                        <td>
                            <a th:href="@{'/chamados/' + ${c.id}}" class="btn btn-secondary btn-sm">Ver</a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        <script th:src="@{/js/script.js}"></script>
    </body>
</html>
