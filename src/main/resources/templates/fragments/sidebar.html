<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
    <head>
        <meta charset="UTF-8">
    </head>
    <body>
        <div th:fragment="sidebar">
            <div id="sidebar" class="d-flex flex-column">
                <h4 class="text-center py-3">Thindesk Menu</h4>
                <ul class="nav flex-column">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/}" aria-current="page">Início</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/chamados}">
                            <i class="bi bi-headset"></i> <span class="d-none d-md-inline">Chamados</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/clientes}">
                            <i class="bi bi-person"></i> <span class="d-none d-md-inline">Clientes</span>
                        </a>
                    </li>
                    <li class="nav-item" sec:authorize="hasRole('ADMINISTRADOR')">
                        <a class="nav-link" th:href="@{/usuarios}">
                            <i class="bi bi-people"></i> <span class="d-none d-md-inline">Usuários</span>
                        </a>
                    </li>
                    <li class="nav-item" sec:authorize="hasRole('ADMINISTRADOR')">
                        <a class="nav-link" th:href="@{/ajustes-horarios}">
                            <i class="bi bi-alarm"></i> <span class="d-none d-md-inline">Horário de Atendimento</span>
                        </a>
                    </li>
                </ul>
                <form th:action="@{/logout}" method="post" class="mt-auto px-3 py-3">
                    <button type="submit" class="btn btn-outline-light btn-sm w-100">
                        <i class="bi bi-box-arrow-right"></i> <span class="d-none d-md-inline">Sair</span>
                    </button>
                </form>
            </div>
        </div>
    </body>
</html>
