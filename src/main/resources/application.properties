spring.config.import=optional:file:.env[.properties]

spring.data.mongodb.uri=${MONGO_URI}
spring.data.mongodb.database=thindesk
spring.data.mongodb.auto-index-creation=true

# Administrador inicial (criado no primeiro start, se ainda não existir)
thindesk.admin.usuario=${ADMIN_USUARIO:admin}
thindesk.admin.senha-inicial=${ADMIN_SENHA_INICIAL:}

spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.cache=false

logging.level.com.atrah=DEBUG

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
