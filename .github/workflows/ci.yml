name: Thindesk CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: pom.xml

      - name: Permitir execucao do Maven Wrapper
        run: chmod +x mvnw

      - name: Executar testes e gerar o pacote
        run: ./mvnw --batch-mode clean verify

      - name: Validar a imagem Docker
        run: docker build -t thindesk:${{ github.sha }} .
